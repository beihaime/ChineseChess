name: Build Windows Installer

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Setup WiX 3.11
        shell: pwsh
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip"
          $wixZip = "$env:RUNNER_TEMP\wix311.zip"
          $wixDir = "$env:RUNNER_TEMP\wix311"
          
          Write-Host "Downloading WiX 3.11..."
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip
          Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
          
          # Put WiX 3.11 at the FRONT of PATH so jpackage prefers it
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Also set for current process
          $env:PATH = "$wixDir;$env:PATH"
          
          Write-Host "WiX tools:"
          Get-Command candle.exe, light.exe, wix.exe -ErrorAction SilentlyContinue | Format-Table Name, Source
          
          & "$wixDir\candle.exe" -?

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/package-input
          Copy-Item target/ChineseChess-1.0-SNAPSHOT.jar target/package-input/

      - name: Package EXE (Installer)
        shell: pwsh
        run: |
          Write-Host "Building installer (exe)..."
          jpackage `
            --verbose `
            --type exe `
            --name ChineseChess `
            --app-version 1.0.0 `
            --vendor "Beihaime" `
            --description "Chinese Chess (Xiangqi)" `
            --input target/package-input `
            --main-jar ChineseChess-1.0-SNAPSHOT.jar `
            --main-class com.beihaime.chinesechess.Main `
            --dest target/installer `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser `
            --java-options "-Dfile.encoding=UTF-8"

      - name: Package App Image (Portable)
        shell: pwsh
        run: |
          Write-Host "Building portable app-image..."
          jpackage `
            --verbose `
            --type app-image `
            --name ChineseChess `
            --app-version 1.0.0 `
            --vendor "Beihaime" `
            --description "Chinese Chess (Xiangqi)" `
            --input target/package-input `
            --main-jar ChineseChess-1.0-SNAPSHOT.jar `
            --main-class com.beihaime.chinesechess.Main `
            --dest target/portable `
            --java-options "-Dfile.encoding=UTF-8"
          
          # Zip the portable folder for easy download
          Compress-Archive -Path "target/portable/ChineseChess" -DestinationPath "target/portable/ChineseChess-portable.zip" -Force

      - name: Upload installer (exe)
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChess-Windows-Installer
          path: target/installer/*.exe

      - name: Upload portable (app-image)
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChess-Windows-Portable
          path: target/portable/ChineseChess-portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-installer-${{ github.run_number }}
          name: Windows Build #${{ github.run_number }}
          body: |
            Chinese Chess Windows builds

            - **Installer** (`.exe`): 需要安装，会创建开始菜单快捷方式
            - **Portable** (`.zip`): 解压即用，绿色版，无需安装

            Built from commit: ${{ github.sha }}
          files: |
            target/installer/*.exe
            target/portable/ChineseChess-portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
