name: Build Windows Installer

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Setup WiX 3.11
        shell: pwsh
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip"
          $wixZip = "$env:RUNNER_TEMP\wix311.zip"
          $wixDir = "$env:RUNNER_TEMP\wix311"
          
          Write-Host "Downloading WiX 3.11..."
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip
          Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
          
          # Put WiX 3.11 at the FRONT of PATH so jpackage prefers it
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Also set for current process
          $env:PATH = "$wixDir;$env:PATH"
          
          Write-Host "WiX tools:"
          Get-Command candle.exe, light.exe, wix.exe -ErrorAction SilentlyContinue | Format-Table Name, Source
          
          & "$wixDir\candle.exe" -?

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/package-input
          Copy-Item target/ChineseChess-1.0-SNAPSHOT.jar target/package-input/

      - name: Package EXE
        shell: pwsh
        run: |
          Write-Host "Current PATH (first few):"
          $env:PATH -split ';' | Select-Object -First 5
          
          Write-Host "Which wix/candle:"
          Get-Command wix.exe, candle.exe -ErrorAction SilentlyContinue | Format-Table Name, Source
          
          jpackage `
            --verbose `
            --type exe `
            --name ChineseChess `
            --app-version 1.0.0 `
            --vendor "Beihaime" `
            --description "Chinese Chess (Xiangqi)" `
            --input target/package-input `
            --main-jar ChineseChess-1.0-SNAPSHOT.jar `
            --main-class com.beihaime.chinesechess.Main `
            --dest target/installer `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser `
            --java-options "-Dfile.encoding=UTF-8"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChess-Windows-Installer
          path: target/installer/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-installer-${{ github.run_number }}
          name: Windows Installer #${{ github.run_number }}
          body: |
            Chinese Chess Windows Installer

            - Built from commit: ${{ github.sha }}
            - Workflow run: ${{ github.run_id }}
          files: target/installer/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
